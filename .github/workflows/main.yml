name: Build Android APK

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6' 
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet and Dependencies
        run: |
          pip install flet==0.22.1
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # FIX: Yahan humne APK ke andar Android 16 ki permissions force-inject kar di hain
      - name: Build APK with Flet
        run: flet build apk --permissions storage,manageExternalStorage,photos,videos,audio

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-finder-apk
          path: build/
